<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kele-ia</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: #0b1120; color: #f8fafc; display: flex; flex-direction: column; height: 100dvh; }
    header { padding: 14px 16px; background: #111827; border-bottom: 1px solid #1f2937; display: flex; justify-content: space-between; align-items: center; }
    header strong { color: #29a383; font-size: 1.1rem; }
    header span { font-size: 0.8rem; color: #94a3b8; }
    #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 85%; padding: 11px 15px; border-radius: 14px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; font-size: 0.96rem; }
    .user { background: #29a383; color: #052e16; font-weight: 500; align-self: flex-end; border-bottom-right-radius: 4px; }
    .ai { background: #111827; border: 1px solid #1f2937; align-self: flex-start; border-bottom-left-radius: 4px; }
    footer { padding: 10px 12px; background: #111827; border-top: 1px solid #1f2937; display: flex; gap: 8px; }
    input { flex: 1; padding: 12px 14px; border-radius: 12px; border: 1px solid #334155; background: #0b1120; color: white; font-size: 1rem; outline: none; }
    button { padding: 0 18px; border-radius: 12px; border: none; background: #29a383; color: #052e16; font-weight: bold; font-size: 0.95rem; cursor: pointer; }
    button:disabled { opacity: 0.5; }
  </style>
</head>
<body>

  <header>
    <strong>● Kele-ia</strong>
    <span>En ligne · Direct &amp; Factuel</span>
  </header>

  <div id="chat">
    <div class="msg ai">Bonjour ! Je suis Kele-ia. Pose-moi n'importe quelle question : je réponds de façon directe, claire et factuelle.</div>
  </div>

  <footer>
    <input id="prompt" type="text" placeholder="Écris ta question ici..." autocomplete="off" />
    <button id="send" onclick="envoyer()">Envoyer</button>
  </footer>

  <script src="https://js.puter.com/v2/"></script>
  <script>
    const chatEl = document.getElementById("chat");
    const inputEl = document.getElementById("prompt");
    const sendBtn = document.getElementById("send");

    const history = [
      {
        role: "system",
        content: "Tu es Kele-ia, un assistant polyvalent, direct, cohérent et professionnel, ouvert à tous les sujets. Réponds dans la langue de l'utilisateur (en français par défaut) de façon claire, structurée et sans détour inutile. Règle absolue : n'invente, ne simule et ne suppose jamais aucun fait, chiffre, lien, citation ou source. Si tu ne connais pas la réponse avec certitude ou si une information te manque, dis clairement « Je ne sais pas » ou explique exactement ce qu'il manque, sans jamais combler les vides par de la fiction."
      }
    ];

    function addMsg(text, cls) {
      const div = document.createElement("div");
      div.className = "msg " + cls;
      div.textContent = text;
      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
      return div;
    }

    async function envoyer() {
      const texte = inputEl.value.trim();
      if (!texte) return;

      inputEl.value = "";
      inputEl.disabled = true;
      sendBtn.disabled = true;

      addMsg(texte, "user");
      const aiBox = addMsg("Réflexion...", "ai");
      history.push({ role: "user", content: texte });

      try {
        const response = await puter.ai.chat(history, { stream: true });
        let reponseComplete = "";
        aiBox.textContent = "";

        for await (const part of response) {
          if (part?.text) {
            reponseComplete += part.text;
            aiBox.textContent = reponseComplete;
            chatEl.scrollTop = chatEl.scrollHeight;
          }
        }

        if (!reponseComplete) {
          reponseComplete = String(response?.message?.content || response || "Aucune réponse reçue.");
          aiBox.textContent = reponseComplete;
        }

        history.push({ role: "assistant", content: reponseComplete });
      } catch (err) {
        aiBox.textContent = "Erreur : " + (err?.message || JSON.stringify(err));
      } finally {
        inputEl.disabled = false;
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    inputEl.addEventListener("keypress", (e) => {
      if (e.key === "Enter") envoyer();
    });
  </script>
</body>
</html>
