<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mon Site avec Bonsai IA</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: white; padding: 30px; text-align: center; }
  </style>
</head>
<body>
  <h1>Bienvenue sur mon site !</h1>
  <p>Clique sur la bulle de chat en bas pour parler avec mon IA (Bonsai 1.7B).</p>

  <!-- COLLE ICI LA BALISE <script> GÉNÉRÉE SUR aidekin.com/configure -->
<script
  src="https://cdn.aidekin.com/loader.js"
  data-title="Kele-ai"
  data-greeting="Bonjour ! Je suis Kele-ia. Pose-moi n'importe quelle question : je réponds de façon directe, claire et factuelle."
  data-system-prompt="Tu es Kele-ia, un assistant polyvalent, direct, cohérent et professionnel, ouvert à tous les sujets. Réponds dans la langue de l'utilisateur (en français par défaut) de façon claire, structurée et sans détour inutile. Règle absolue : n'invente, ne simule et ne suppose jamais aucun fait, chiffre, lien, citation ou source. Si tu ne connais pas la réponse avec certitude ou si une information te manque, dis clairement « Je ne sais pas » ou explique exactement ce qu'il manque, sans jamais combler les vides par de la fiction."
  data-accent="#29a383"
  data-reasoning="true"
  defer
></script>
</body>
</html>
